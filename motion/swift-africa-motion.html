:root{--orange:#ff6b00;--orange2:#ff8c00;--navy:#1a1a2e;--navy2:#16213e;--navy3:#0f3460;--green:#10b981;--ink:#111827}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04060d;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;transform-origin:center center;
  background:
   radial-gradient(900px 760px at 78% 14%,rgba(255,107,0,.20),transparent 62%),
   radial-gradient(1000px 900px at 8% 92%,rgba(15,52,96,.65),transparent 66%),
   linear-gradient(165deg,var(--navy) 0%,var(--navy2) 42%,var(--navy3) 78%,#0a1020 100%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%);z-index:20}
#pool{position:absolute;left:50%;top:50%;width:1100px;height:620px;margin:-250px 0 0 -550px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,107,0,.20),rgba(255,107,0,.05) 60%,transparent);opacity:0}
#scene{position:absolute;inset:0;perspective:3000px;perspective-origin:50% 50%}
#phone{position:absolute;left:50%;top:50%;width:520px;height:1068px;margin:-534px 0 0 -260px;transform-style:preserve-3d;opacity:0;will-change:transform}
.layer{position:absolute;inset:0;border-radius:76px}
.edge{background:linear-gradient(90deg,#3d414d,#1c1e25 50%,#3d414d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.front{background:#050608;box-shadow:inset 0 0 0 3px #747a89,inset 0 0 0 6px #15161b,0 0 0 1px #0a0a0c;transform:translateZ(1px)}
.sbtn{position:absolute;width:7px;border-radius:4px;background:linear-gradient(90deg,#555a67,#2a2c34);transform:translateZ(-6px)}
.shadow{position:absolute;border-radius:90px;background:#000}
.screen{position:absolute;left:14px;top:14px;right:14px;bottom:14px;border-radius:62px;overflow:hidden;background:#fff;isolation:isolate}
.island{position:absolute;top:12px;left:50%;width:126px;height:36px;margin-left:-63px;background:#000;border-radius:20px;z-index:6}
.glare{position:absolute;top:-10%;bottom:-10%;left:-90%;width:280%;z-index:7;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(112deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.05) 41%,rgba(255,255,255,.17) 46%,rgba(255,255,255,.05) 51%,rgba(255,255,255,0) 56%)}
.gloss{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(120% 60% at 15% -5%,rgba(255,255,255,.13),transparent 55%)}

/* ===== contenu du site (design 390px) ===== */
#content{position:absolute;left:0;top:0;width:390px;transform-origin:0 0;will-change:transform;color:var(--ink);background:#fff}
#fixed{position:absolute;left:0;top:0;width:390px;transform-origin:0 0;z-index:5}
.nav{background:transparent;border-bottom:1px solid transparent;transition:background .35s,box-shadow .35s,border-color .35s}
.fixedlayer.scrolled .nav{background:rgba(255,255,255,.94);border-bottom-color:rgba(0,0,0,.06);box-shadow:0 4px 24px -8px rgba(0,0,0,.14)}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;color:#fff;font-weight:700;font-size:15px;transition:color .35s}
.fixedlayer.scrolled .status{color:#111827}
.status .ic{display:flex;gap:6px;align-items:center}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 11px}
.logo{display:flex;align-items:center;gap:8px}
.logo .sq{width:36px;height:36px;border-radius:12px;background:var(--orange);display:grid;place-items:center;box-shadow:0 4px 10px -2px rgba(255,107,0,.4)}
.logo b{font-size:18px;font-weight:900;letter-spacing:-.02em;color:#fff;transition:color .35s}
.fixedlayer.scrolled .logo b{color:#111827}
.burger{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#fff;transition:background .35s,color .35s}
.fixedlayer.scrolled .burger{background:#f3f4f6;color:#111827}

.hero{height:824px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 22px 0;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 70%,#1a1a2e 100%);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,.4),rgba(0,0,0,.7))}
.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:-60px;bottom:-120px;background:radial-gradient(closest-side,rgba(255,107,0,.28),transparent)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0 0 18px;font-weight:900;letter-spacing:-.025em;color:#fff;font-size:54px;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.hero h1 span{display:block}
.hero p{margin:0 0 26px;max-width:330px;font-size:14.5px;line-height:1.55;font-weight:600;color:rgba(255,255,255,.9);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:14px 28px;font-weight:700;font-size:16px}
.btn.o{background:var(--orange);color:#fff;box-shadow:0 10px 24px -6px rgba(255,107,0,.55)}
.btn.g{border:2px solid rgba(255,255,255,.5);color:#fff;font-weight:600;margin-top:12px}
.hero .more{position:absolute;bottom:22px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:rgba(255,255,255,.6)}
.hero .more i{display:block;width:2px;height:20px;border-radius:2px;background:rgba(255,255,255,.4)}

section.s{padding:56px 16px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;background:rgba(255,107,0,.1);color:var(--orange);font-weight:600;font-size:13px}
.h2{font-size:30px;font-weight:900;letter-spacing:-.025em;line-height:1.12;margin:12px 0 10px}
.lead{font-size:14.5px;line-height:1.55;color:#4b5563;margin:0 auto;max-width:340px}
.center{text-align:center}
.or{color:var(--orange)}

.roles{background:#f9fafb}
.role{border-radius:24px;padding:24px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:16px;text-align:left}
.role.f{background:linear-gradient(135deg,#ff6b00,#ff8c00);color:#fff;box-shadow:0 24px 50px -16px rgba(255,107,0,.5)}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.ricon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.rnum{font-size:44px;font-weight:900;opacity:.1;line-height:1}
.role h3{margin:0 0 6px;font-size:22px;font-weight:900}
.role p{margin:0 0 16px;font-size:14px;line-height:1.55;color:#6b7280}
.role.f p{color:rgba(255,255,255,.82)}
.role ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.role li{display:flex;align-items:center;gap:10px;font-size:13px;color:#374151}
.role.f li{color:rgba(255,255,255,.92)}
.role li i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}

.tabs{display:flex;justify-content:center;gap:8px;margin:22px 0 18px}
.tab{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:16px;background:#f3f4f6;color:#6b7280;font-weight:700;font-size:13px}
.tab.on{background:#3b82f6;color:#fff;box-shadow:0 8px 20px -6px rgba(59,130,246,.6)}
.step{display:flex;gap:14px;text-align:left;background:#fff;border:1px solid #f1f2f4;border-radius:20px;padding:18px;margin-top:12px;box-shadow:0 6px 18px -10px rgba(17,24,39,.18)}
.step .bub{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.step small{font-size:11px;font-weight:800;letter-spacing:.08em}
.step h4{margin:2px 0 4px;font-size:16px;font-weight:800}
.step p{margin:0;font-size:12.5px;line-height:1.5;color:#6b7280}

.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 18px}
.cat{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700;color:#374151}
.cat i{width:8px;height:8px;border-radius:50%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px -12px rgba(17,24,39,.3);text-align:left}
.prod img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.prod div{padding:10px 12px 13px}
.prod b{display:block;font-size:12.5px;font-weight:800;line-height:1.25;margin-bottom:5px}
.prod span{font-size:12.5px;font-weight:800;color:var(--orange)}
.prod s{font-size:11px;color:#9ca3af;margin-left:6px}
.pill{display:inline-flex;margin-top:20px;padding:14px 26px;border-radius:16px;background:var(--orange);color:#fff;font-weight:700;font-size:15px;box-shadow:0 10px 24px -6px rgba(255,107,0,.5)}

.sec{background:#f9fafb}
.sstep{display:flex;gap:14px;text-align:left;margin-top:14px}
.sstep .bub{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff}
.sstep h4{margin:2px 0 3px;font-size:16px;font-weight:800}
.sstep p{margin:0;font-size:12.5px;line-height:1.5;color:#6b7280}
.sline{position:relative}
.sline::before{content:"";position:absolute;left:23px;top:30px;bottom:30px;width:2px;background:linear-gradient(#ff6b00,#10b981);opacity:.3}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:40px 16px}
.stat{border-radius:20px;background:#fff;padding:18px 14px;text-align:center;box-shadow:0 6px 20px -10px rgba(17,24,39,.25);border:1px solid #f1f2f4}
.stat .bub{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin:0 auto 10px}
.stat strong{display:block;font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1}
.stat strong em{font-style:normal;font-size:12px;font-weight:700;color:#6b7280;letter-spacing:0}
.stat p{margin:8px 0 0;font-size:11.5px;line-height:1.35;color:#6b7280}

.testi{background:#fff}
.quote{text-align:left;border-radius:20px;background:#f9fafb;padding:18px;margin-top:14px;border:1px solid #f1f2f4}
.stars{display:flex;gap:2px;margin-bottom:8px}
.quote p{margin:0 0 12px;font-size:13px;line-height:1.55;color:#374151}
.quote b{font-size:13.5px;font-weight:800}
.quote small{display:block;font-size:11.5px;color:#9ca3af;margin-top:1px}

.part{background:#fff;padding-top:48px}
.why{border-radius:24px;background:linear-gradient(135deg,#ff6b00,#ff8c00);color:#fff;padding:24px;margin-top:20px;text-align:left;box-shadow:0 24px 50px -16px rgba(255,107,0,.5)}
.why h3{margin:0 0 14px;font-size:20px;font-weight:900}
.why li{list-style:none;display:flex;gap:10px;font-size:13px;line-height:1.45;margin-top:10px;color:rgba(255,255,255,.95)}
.why ul{margin:0;padding:0}
.why li i{flex:none;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;margin-top:1px}

footer{background:#111827;color:#fff;padding:36px 22px 44px}
footer .logo b{color:#fff;font-size:20px}
footer p{font-size:13px;line-height:1.6;color:#9ca3af;margin:16px 0 20px}
footer .ct{display:flex;align-items:center;gap:10px;font-size:13px;color:#d1d5db;margin-top:12px}
footer .ct i{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center}

/* ===== légendes & fin ===== */
#cap{position:absolute;left:0;right:0;top:300px;display:flex;justify-content:center;opacity:0;z-index:10}
#cap span{display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.88);font-weight:700;font-size:32px;letter-spacing:.01em;backdrop-filter:blur(8px);transition:opacity .35s}
#cap i{width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:0 0 18px var(--orange)}
#title{position:absolute;left:560px;top:560px;width:470px;z-index:10;color:#fff}
#title .mark{width:96px;height:96px;border-radius:28px;background:var(--orange);display:grid;place-items:center;box-shadow:0 20px 50px -10px rgba(255,107,0,.6);margin-bottom:34px;opacity:0}
#title h1{margin:0;font-size:136px;line-height:.98;font-weight:900;letter-spacing:-.04em}
#title h1 span{display:block;opacity:0}
#title .slogan{margin-top:34px;font-size:50px;line-height:1.14;font-weight:800;letter-spacing:-.02em;color:rgba(255,255,255,.92)}
#title .slogan span{display:block;opacity:0}
#title .slogan .or{color:var(--orange)}
#title .sub{margin:26px 0 0;font-size:27px;line-height:1.4;font-weight:500;color:rgba(255,255,255,.62);opacity:0}
#outro{position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:10;opacity:0}
#outro .rule{width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--orange),transparent)}
#outro .row{display:flex;align-items:center;gap:22px}
#outro .lg{width:84px;height:84px;border-radius:24px;overflow:hidden;background:var(--orange);display:grid;place-items:center;box-shadow:0 16px 40px -10px rgba(255,107,0,.55)}
#outro .lg img{width:100%;height:100%;object-fit:contain}
#outro .lg b{font-size:54px;font-weight:900;color:#fff;line-height:1;margin-top:-4px}
#outro .url{font-size:58px;font-weight:800;letter-spacing:-.02em;color:#fff}
#replay{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:30;font:600 24px 'Plus Jakarta Sans',sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);padding:14px 38px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);opacity:.9;transition:opacity .5s}
#replay:hover{color:#fff;background:rgba(255,255,255,.14)}
#replay.off{opacity:0;pointer-events:none}
</style>
</head>

<div id="stage">
  <div id="pool"></div>
  <div id="cap"><span><i></i><b id="capt" style="font-weight:700">Accueil</b></span></div>

  <div id="scene">
    <div id="phone">
      <div class="shadow" id="sh1" style="inset:30px -4px -34px -4px;filter:blur(44px);opacity:.75;transform:translate3d(30px,46px,-18px)"></div>
      <div class="shadow" id="sh2" style="inset:14px 6px -4px 6px;filter:blur(12px);opacity:.55;transform:translate3d(8px,12px,-17px)"></div>
      <div id="edges"></div>
      <span class="sbtn" style="left:-5px;top:170px;height:44px"></span>
      <span class="sbtn" style="left:-5px;top:250px;height:78px"></span>
      <span class="sbtn" style="left:-5px;top:346px;height:78px"></span>
      <span class="sbtn" style="right:-5px;top:300px;height:126px"></span>
      <div class="layer front">
        <div class="screen">
          <div class="island"></div>
          <div class="glare" id="glare"></div>
          <div class="gloss"></div>
          <div id="fixed" class="fixedlayer">
            <div class="nav">
              <div class="status"><span>9:41</span><span class="ic" id="sicons"></span></div>
              <div class="navrow">
                <div class="logo"><div class="sq" id="navlogo"></div><b>Swift Africa</b></div>
                <div class="burger" id="burger"></div>
              </div>
            </div>
          </div>
          <div id="content"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="title">
    <div class="mark" id="tmark"></div>
    <h1><span>Swift</span><span>Africa</span></h1>
    <div class="slogan"><span>Commandez.</span><span>Vendez.</span><span class="or">Livrez.</span></div>
    <p class="sub">Paiement bloqué jusqu'à la livraison. Zéro arnaque.</p>
  </div>

  <div id="outro">
    <div class="rule"></div>
    <div class="row">
      <div class="lg" id="plogo"></div>
      <div class="url">prospyto.dev</div>
    </div>
  </div>

  <button id="replay" type="button">Rejouer</button>
</div>

/* logo prospyto */
(function(){const el=$('plogo');
  if(PROSPYTO_LOGO_SRC){el.style.background='transparent';el.innerHTML=`<img src="${PROSPYTO_LOGO_SRC}" alt="prospyto">`}
  else el.innerHTML='<b>p</b>';})();

/* arêtes du téléphone (épaisseur 3D) */
(function(){const w=$('edges');let h='';for(let i=1;i<=14;i++)h+=`<div class="layer edge" style="transform:translateZ(${-i}px)"></div>`;w.innerHTML=h;})();

/* ============ MISE À L'ÉCHELLE ============ */
const stage=$('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ============ OUTILS ============ */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eSine=t=>-(Math.cos(Math.PI*t)-1)/2;
const eCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOut=t=>1-Math.pow(1-t,3);
const eBack=(t,c=1.1)=>{const c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const spring=u=>1-Math.exp(-7.5*u)*Math.cos(10*u);

/* ============ MESURES & PROFIL DE DÉFILEMENT ============ */
const SC=492/390, VIEW_H=1040/SC;
const content=$('content'),fixedL=$('fixed'),phone=$('phone'),glare=$('glare');
content.style.transform=`translate3d(0,0,0) scale(${SC})`;fixedL.style.transform=`scale(${SC})`;
let YMAX=0,sects=[],cumT=[],NS=600;
function measure(){
  const H=content.offsetHeight;YMAX=Math.max(1,H-VIEW_H);
  sects=[...content.querySelectorAll('[data-cap]')].map(e=>({top:e.offsetTop,cap:e.dataset.cap,slow:e.dataset.slow!==undefined?e.offsetTop+(e.dataset.slow==='0'?0:230):null}));
  const cs=sects.filter(s=>s.slow!==null).map(s=>Math.min(s.slow,YMAX));
  // densité de temps : plus élevée près des sections importantes (= ralenti)
  cumT=[0];
  for(let i=1;i<=NS;i++){
    const y=(i-.5)/NS*YMAX;let d=1;
    cs.forEach(c=>{d+=2.4*Math.exp(-Math.pow((y-c)/230,2))});
    cumT.push(cumT[i-1]+d);
  }
}
function yAt(p){ // p 0..1 (temps normalisé) → position de scroll
  const tgt=p*cumT[NS];let lo=0,hi=NS;
  while(hi-lo>1){const m=(lo+hi)>>1;(cumT[m]<=tgt)?lo=m:hi=m}
  const f=(tgt-cumT[lo])/Math.max(1e-6,cumT[hi]-cumT[lo]);
  return (lo+f)/NS*YMAX;
}

/* ============ CHRONOLOGIE ============ */
const TL={start:.35,enter:1.7};
TL.sS=TL.start+TL.enter+.1; TL.sE=TL.sS+SCROLL_DURATION;
TL.rS=TL.sE+.15; TL.rD=1.7; TL.rE=TL.rS+TL.rD;
TL.tIn=TL.rE-.55; TL.oIn=TL.tIn+1.9; TL.end=TL.oIn+3.8;

const FLAT={x:0,y:-20,a:50,b:-16,s:1.1};
const FINAL={x:-262,y:-40,a:0,b:0,s:.8};

function orbit(t){
  const up=clamp((t-(TL.sS-.5))/(SCROLL_DURATION+.5));
  const e=eSine(up);
  return {x:-24+48*e, y:FLAT.y+10*Math.sin(up*Math.PI), a:50+3.5*Math.sin(up*Math.PI)-1.5*e, b:-16+30*e, s:FLAT.s};
}

const cap=$('cap'),capt=$('capt'),title=$('title'),tmark=$('tmark'),outro=$('outro'),pool=$('pool');
const tH1=[...title.querySelectorAll('h1 span')],tSl=[...title.querySelectorAll('.slogan span')],tSub=title.querySelector('.sub');
function reveal(el,t,tIn,dur,dy=46,blur=14){
  const p=eOut(clamp((t-tIn)/dur));
  el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;el.style.filter=p<1?`blur(${(1-p)*blur}px)`:'none';
}
let curCap='';
function frame(t){
  /* — téléphone — */
  let P=orbit(t), up_t=0, ry=0;
  const ue=clamp((t-TL.start)/TL.enter), sp=spring(ue);
  const rp=clamp((t-TL.rS)/TL.rD);
  let shadow=1;
  if(t>=TL.rS){
    const base=orbit(TL.rS), pe=eCubic(rp), pa=eBack(rp,1.15);
    P={x:lerp(base.x,FINAL.x,pe),y:lerp(base.y,FINAL.y,pe),a:lerp(base.a,FINAL.a,pa),b:lerp(base.b,FINAL.b,pe),s:lerp(base.s,FINAL.s,pe)};
    shadow=1-eCubic(clamp(rp*1.4));
    const k=clamp((t-TL.rE)/1.2); ry=Math.sin((t-TL.rE)*1.1)*5*eSine(k);
    P.y+=Math.sin((t-TL.rE)*1.7)*6*eSine(k);
  }
  const yOff=780*(1-sp);
  const sEntry=.94+.06*sp;
  phone.style.opacity=clamp(ue*4);
  phone.style.transform=`translate3d(${P.x}px,${P.y+yOff}px,0) rotateX(${P.a}deg) rotateY(${ry}deg) rotateZ(${P.b}deg) scale(${P.s*sEntry})`;
  $('sh1').style.opacity=.75*shadow;$('sh2').style.opacity=.55*shadow;
  pool.style.opacity=clamp(ue*1.2)*(1-clamp(rp*1.2)*.55);
  pool.style.transform=`translate(${-P.x*.2+ (t>=TL.rS?FINAL.x*.2*eCubic(rp):0)}px,${(t>=TL.rS?eCubic(rp)*390:0)}px) scale(${1-.25*eCubic(rp)})`;
  glare.style.transform=`translateX(${P.b*11+ry*16+(P.a-50)*3}px)`;

  /* — défilement du site — */
  let y;
  if(t<TL.sS) y=0;
  else if(t<=TL.sE){const p=clamp((t-TL.sS)/SCROLL_DURATION);y=yAt(.7*p+.3*eSine(p))}
  else if(t<TL.rS+TL.rD){ if(t<TL.rS) y=YMAX; else y=lerp(YMAX,0,eCubic(rp)) }
  else y=0;
  content.style.transform=`translate3d(0,${-y*SC}px,0) scale(${SC})`;
  fixedL.classList.toggle('scrolled',y>40);

  /* — légende de section — */
  let cur=sects[0]&&sects[0].cap;
  for(const s of sects){if(s.top<=y+260)cur=s.cap}
  if(cur!==curCap){curCap=cur;capt.textContent=cur}
  const capIn=clamp((t-(TL.sS-.3))/.6), capOut=1-clamp((t-(TL.rS-.1))/.5);
  cap.style.opacity=capIn*capOut;

  /* — titre, logo — */
  tmark.style.opacity=0;reveal(tmark,t,TL.tIn,.7,40,10);
  tH1.forEach((e,i)=>reveal(e,t,TL.tIn+.12+i*.14,.8,60,16));
  tSl.forEach((e,i)=>reveal(e,t,TL.tIn+.55+i*.16,.7,40,10));
  reveal(tSub,t,TL.tIn+1.1,.8,26,8);
  reveal(outro,t,TL.oIn,.9,34,10);
}

/* ============ LECTURE ============ */
let raf=0,t0=0,running=false,btnTimer=0;
const btn=$('replay');
function reset(){cancelAnimationFrame(raf);phone.style.opacity=0;cap.style.opacity=0;
  [tmark,...tH1,...tSl,tSub,outro].forEach(e=>{e.style.opacity=0});pool.style.opacity=0}
function loop(now){
  const t=(now-t0)/1000;
  frame(Math.min(t,TL.end));
  if(t<TL.end){raf=requestAnimationFrame(loop)}
  else{running=false;btnTimer=setTimeout(()=>btn.classList.remove('off'),5000)}
}
function play(){
  clearTimeout(btnTimer);btn.classList.add('off');
  reset();measure();running=true;
  t0=performance.now()+400;           // 0,4 s de marge après le clic
  frame(0);raf=requestAnimationFrame(loop);
}
btn.addEventListener('click',play);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'||e.key===' '||e.key==='Enter'){e.preventDefault();play()}});
reset();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{measure();frame(0);reset();if(AUTO_START)play()});
</script>
</body>
</html>
